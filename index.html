<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Monitoring & Validasi KSP</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .hero-header { background: linear-gradient(135deg, #0d6efd, #0dcaf0); color: white; border-radius: 0 0 20px 20px; }
    .badge-feedback-empty { background-color: #e0e0e0; color: #6c757d; font-weight: 500; }
    .table-responsive { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .nav-pills .nav-link.active { background-color: #0d6efd; font-weight: 600; }
    .btn-filter-doc { border-radius: 20px; font-size: 0.875rem; font-weight: 500; }
  </style>
</head>
<body>

  <!-- Header & Akses Cepat -->
  <div class="hero-header p-4 p-md-5 mb-4 text-center">
    <h2 class="fw-bold mb-2"><i class="fa-solid fa-file-signature me-2"></i>Monitoring & Validasi KSP</h2>
    <p class="mb-4 opacity-75">Sistem Informasi Pengumpulan dan Validasi Kurikulum Satuan Pendidikan</p>
    
    <div class="d-flex justify-content-center gap-3 flex-wrap">
      <!-- PASTE LINK GOOGLE FORM UPLOAD GURU DI BAWAH INI -->
      <a href="https://forms.gle/c2XioiAmETwb6dub7" target="_blank" class="btn btn-light btn-lg fw-semibold shadow-sm">
        <i class="fa-solid fa-cloud-arrow-up text-primary me-2"></i>Upload Dokumen KSP
      </a>
      <!-- PASTE LINK GOOGLE FORM / SHEET VALIDASI PENGAWAS DI BAWAH INI -->
      <a href="https://docs.google.com/spreadsheets/d/1mCKVQ584Kw0EQCoi71rd13Oy29exLlNTnh2_y1oektY/edit?usp=sharing" target="_blank" class="btn btn-warning btn-lg fw-semibold shadow-sm text-dark">
        <i class="fa-solid fa-user-check me-2"></i>Validasi Pengawas
      </a>
    </div>
  </div>

  <div class="container my-4">
    
    <!-- Tab Navigasi Gugus Utama -->
    <ul class="nav nav-pills justify-content-center mb-3 gap-2" id="gugusTab" role="tablist">
      <li class="nav-item">
        <button class="nav-link active px-4 py-2" onclick="setGugusFilter('Semua')">Semua Gugus</button>
      </li>
      <li class="nav-item">
        <button class="nav-link px-4 py-2" onclick="setGugusFilter('Gugus 1')">Gugus 1</button>
      </li>
      <li class="nav-item">
        <button class="nav-link px-4 py-2" onclick="setGugusFilter('Gugus 2')">Gugus 2</button>
      </li>
      <li class="nav-item">
        <button class="nav-link px-4 py-2" onclick="setGugusFilter('Gugus 3')">Gugus 3</button>
      </li>
      <li class="nav-item">
        <button class="nav-link px-4 py-2" onclick="setGugusFilter('Gugus 4')">Gugus 4</button>
      </li>
    </ul>

    <!-- Filter Jenis Dokumen (Disesuaikan Presisi dengan Form: Draft / Revisi / Siap Ditetapkan) -->
    <div class="d-flex justify-content-center gap-2 mb-4 flex-wrap" id="docTypeFilter">
      <button class="btn btn-primary btn-filter-doc active" onclick="setDocFilter('Semua')">
        <i class="fa-solid fa-layer-group me-1"></i> Semua Jenis Dokumen
      </button>
      <button class="btn btn-outline-secondary btn-filter-doc" onclick="setDocFilter('Draft KSP')">
        <i class="fa-solid fa-file-lines me-1"></i> Draft KSP
      </button>
      <button class="btn btn-outline-warning text-dark btn-filter-doc" onclick="setDocFilter('KSP Hasil Revisi')">
        <i class="fa-solid fa-rotate me-1"></i> KSP Hasil Revisi
      </button>
      <button class="btn btn-outline-success btn-filter-doc" onclick="setDocFilter('KSP Siap Ditetapkan')">
        <i class="fa-solid fa-circle-check me-1"></i> KSP Siap Ditetapkan
      </button>
    </div>

    <!-- Area Tabel Data -->
    <div class="table-responsive p-3">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th scope="col">No</th>
            <th scope="col">Satuan Pendidikan / Kepala Sekolah</th>
            <th scope="col">Gugus</th>
            <th scope="col">Jenis Dokumen</th>
            <th scope="col">Berkas KSP</th>
            <th scope="col">Status Validasi</th>
            <th scope="col">Umpan Balik Pengawas</th>
          </tr>
        </thead>
        <tbody id="tableBody">
          <!-- Loading State -->
          <tr>
            <td colspan="7" class="text-center py-5">
              <div class="spinner-border text-primary" role="status"></div>
              <p class="mt-2 text-muted mb-0">Memuat data KSP...</p>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
    // MASUKKAN URL WEB APP GOOGLE APPS SCRIPT KAMU DI BAWAH INI
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxhnYPYvtldmfWPC1KsrMTvCCtdfw5Gzg_uP0q4RG7ByslyvyRiUL_ekkFnxXWiaw80/exec";

    let rawData = [];
    let currentGugusFilter = "Semua";
    let currentDocFilter = "Semua";

    // Ambil Data dari GAS
    async function loadData() {
      try {
        const response = await fetch(GAS_API_URL);
        rawData = await response.json();
        renderTable();
      } catch (error) {
        document.getElementById('tableBody').innerHTML = `
          <tr>
            <td colspan="7" class="text-center text-danger py-4">
              <i class="fa-solid fa-triangle-exclamation fs-3 mb-2"></i><br>
              Gagal memuat data. Pastikan URL Google Apps Script sudah benar.
            </td>
          </tr>`;
      }
    }

    // Filter Berdasarkan Gugus
    function setGugusFilter(gugus) {
      currentGugusFilter = gugus;
      
      const buttons = document.querySelectorAll('#gugusTab .nav-link');
      buttons.forEach(btn => {
        if (btn.innerText.includes(gugus)) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      renderTable();
    }

    // Filter Berdasarkan Jenis Dokumen
    function setDocFilter(docType) {
      currentDocFilter = docType;

      const buttons = document.querySelectorAll('#docTypeFilter .btn');
      buttons.forEach(btn => {
        const btnText = btn.innerText.toLowerCase();
        const targetText = docType.toLowerCase();

        if (btnText.includes(targetText) || (docType === 'Semua' && btnText.includes('semua'))) {
          btn.classList.add('active', 'btn-primary');
          btn.classList.remove('btn-outline-secondary', 'btn-outline-warning', 'btn-outline-success', 'btn-outline-primary');
        } else {
          btn.classList.remove('active', 'btn-primary');
          if (btnText.includes('draft')) btn.classList.add('btn-outline-secondary');
          if (btnText.includes('revisi')) btn.classList.add('btn-outline-warning');
          if (btnText.includes('siap')) btn.classList.add('btn-outline-success');
          if (btnText.includes('semua')) btn.classList.add('btn-outline-primary');
        }
      });

      renderTable();
    }

    // Tampilkan Data ke Tabel
    function renderTable() {
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = "";

      // Filtering Bertingkat (Gugus AND Jenis Dokumen)
      const filtered = rawData.filter(item => {
        const matchGugus = currentGugusFilter === "Semua" || 
          (item["Gugus kerja"] || "").toString().trim().toLowerCase() === currentGugusFilter.toLowerCase();
        
        const docText = (item["Jenis Dokumen"] || "").toString().trim().toLowerCase();
        let matchDoc = true;

        if (currentDocFilter !== "Semua") {
          // Fleksibel pencocokan untuk Draft, Revisi, maupun Siap Ditetapkan
          matchDoc = docText.includes(currentDocFilter.toLowerCase()) || 
                     (currentDocFilter.includes("Draft") && docText.includes("draf"));
        }

        return matchGugus && matchDoc;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" class="text-center py-4 text-muted">
              Tidak ada data KSP yang cocok untuk filter saat ini.
            </td>
          </tr>`;
        return;
      }

      filtered.forEach((row, index) => {
        const sekolah = row["Nama Satuan Pendidikan"] || "-";
        const npsn = row["NPSN"] || "-";
        const ks = row["Nama Lengkap Kepala Sekolah"] || "-";
        const gugus = row["Gugus kerja"] || "-";
        const jenisDoc = row["Jenis Dokumen"] || "-";
        const linkDoc = row["Unggah Berkas Dokumen KSP"] || "#";
        const statusVal = (row["Status Validasi"] || "").trim();
        const feedback = (row["Umpan Balik pengawas"] || "").trim();

        // Status Validasi Visual
        let badgeStatus = `<span class="badge bg-secondary">Belum Divalidasi</span>`;
        if (statusVal.toLowerCase().includes("tervalidasi") || statusVal.toLowerCase().includes("sesuai") || statusVal.toLowerCase().includes("siap")) {
          badgeStatus = `<span class="badge bg-success"><i class="fa-solid fa-check me-1"></i>${statusVal}</span>`;
        } else if (statusVal.toLowerCase().includes("revisi") || statusVal.toLowerCase().includes("perbaikan")) {
          badgeStatus = `<span class="badge bg-warning text-dark"><i class="fa-solid fa-rotate me-1"></i>${statusVal}</span>`;
        } else if (statusVal !== "") {
          badgeStatus = `<span class="badge bg-info text-dark">${statusVal}</span>`;
        }

        // Umpan Balik Pengawas
        let feedbackContent = `<span class="badge badge-feedback-empty px-3 py-2">Belum ada umpan balik</span>`;
        if (feedback !== "") {
          feedbackContent = `<div class="p-2 bg-light border rounded text-dark small"><i class="fa-regular fa-comment-dots me-1 text-primary"></i>${feedback}</div>`;
        }

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${index + 1}</td>
          <td>
            <div class="fw-bold">${sekolah}</div>
            <div class="text-muted small">NPSN: ${npsn} | KS: ${ks}</div>
          </td>
          <td><span class="badge bg-outline-primary border text-primary">${gugus}</span></td>
          <td><span class="badge bg-light text-dark border">${jenisDoc}</span></td>
          <td>
            ${linkDoc !== "#" && linkDoc !== "" 
              ? `<a href="${linkDoc}" target="_blank" class="btn btn-sm btn-outline-primary"><i class="fa-solid fa-file-pdf me-1"></i>Lihat Dokumen</a>`
              : `<span class="text-muted small">Tidak ada berkas</span>`
            }
          </td>
          <td>${badgeStatus}</td>
          <td>${feedbackContent}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    loadData();
  </script>
</body>
</html>
